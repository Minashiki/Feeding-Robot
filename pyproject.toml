[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feedingrobot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "mujoco==3.14.0",
  "numpy>=2.2,<2.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
